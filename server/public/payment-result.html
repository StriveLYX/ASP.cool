<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付结果 - ASP.cool</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Noto Sans SC', -apple-system, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(99, 102, 241, 0.2);
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1.5rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #6366f1, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .desc {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }
        .success-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1.5rem;
            animation: pop 0.5s ease-out;
        }
        @keyframes pop {
            0% { transform: scale(0); }
            60% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .success-title { color: #10b981; }
        .close-hint {
            color: #64748b;
            font-size: 0.85rem;
            margin-top: 1rem;
        }
        .btn {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: linear-gradient(135deg, #6366f1, #06b6d4);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
        }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="spinner"></div>
        <div class="title">正在确认支付结果...</div>
        <div class="desc">请稍候，正在验证支付状态</div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const orderId = params.get('out_trade_no') || params.get('order_id');
        const API_BASE = 'https://api.asp.cool';

        // 尝试通知父窗口支付完成
        function notifyParent(success) {
            try {
                // 如果是被 window.open 打开的弹窗，通知父窗口
                if (window.opener && !window.opener.closed) {
                    window.opener.postMessage({
                        type: 'alipay_payment_result',
                        success: success,
                        orderId: orderId
                    }, '*');
                }
            } catch (e) {
                console.log('无法通知父窗口:', e);
            }
        }

        async function checkPayment() {
            if (!orderId) {
                // 没有订单号，直接通知父窗口并关闭
                notifyParent(true);
                setTimeout(() => window.close(), 1500);
                return;
            }

            try {
                const resp = await fetch(`${API_BASE}/api/payments/query?order_id=${encodeURIComponent(orderId)}`);
                const result = await resp.json();

                if (result.success && result.data && result.data.status === 'paid') {
                    // 支付成功
                    document.getElementById('app').innerHTML = `
                        <div class="success-icon">✅</div>
                        <div class="title success-title">支付成功</div>
                        <div class="desc">感谢你的支付，此窗口将自动关闭</div>
                        <div class="close-hint">如果没有自动关闭，请点击下方按钮</div>
                        <button class="btn" onclick="window.close()">关闭此窗口</button>
                    `;
                    notifyParent(true);
                    setTimeout(() => window.close(), 3000);
                } else {
                    // 仍在处理中
                    document.getElementById('app').innerHTML = `
                        <div class="spinner"></div>
                        <div class="title">支付处理中</div>
                        <div class="desc">支付结果确认中，请返回原页面查看</div>
                        <button class="btn" onclick="window.close()">返回原页面</button>
                    `;
                    notifyParent(true); // 仍然通知，让父窗口继续轮询
                    setTimeout(() => window.close(), 5000);
                }
            } catch (err) {
                document.getElementById('app').innerHTML = `
                    <div class="title">正在确认支付结果</div>
                    <div class="desc">请返回原页面查看支付状态</div>
                    <button class="btn" onclick="window.close()">返回原页面</button>
                `;
                notifyParent(true);
                setTimeout(() => window.close(), 3000);
            }
        }

        // 页面加载后立即检查
        checkPayment();

        // 10秒后无论如何尝试关闭
        setTimeout(() => {
            try { window.close(); } catch(e) {}
        }, 10000);
    </script>
</body>
</html>
