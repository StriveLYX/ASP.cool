<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASP.cool - 支付宝支付</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .plan {
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .plan:hover {
            border-color: #1677ff;
            transform: translateY(-2px);
        }
        .plan.selected {
            border-color: #1677ff;
            background: #f0f7ff;
        }
        .plan-name {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        .plan-price {
            font-size: 24px;
            color: #1677ff;
            font-weight: bold;
        }
        .plan-price span {
            font-size: 14px;
            color: #999;
            font-weight: normal;
        }
        .plan-desc {
            color: #666;
            font-size: 14px;
            margin-top: 8px;
        }
        .pay-btn {
            width: 100%;
            padding: 15px;
            background: #1677ff;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }
        .pay-btn:hover {
            background: #0958d9;
        }
        .pay-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .error {
            color: #ff4d4f;
            text-align: center;
            padding: 10px;
            background: #fff2f0;
            border-radius: 8px;
            margin-top: 15px;
        }
        .success {
            color: #52c41a;
            text-align: center;
            padding: 10px;
            background: #f6ffed;
            border-radius: 8px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ASP.cool</h1>
        <p class="subtitle">选择适合您的套餐</p>

        <div class="plan selected" data-plan="basic" data-amount="1">
            <div class="plan-name">基础版</div>
            <div class="plan-price">¥1 <span>/ 月</span></div>
            <div class="plan-desc">适合个人开发者，包含基础功能</div>
        </div>

        <div class="plan" data-plan="pro" data-amount="1">
            <div class="plan-name">专业版</div>
            <div class="plan-price">¥1 <span>/ 月</span></div>
            <div class="plan-desc">适合小型团队，包含高级功能</div>
        </div>

        <div class="plan" data-plan="enterprise" data-amount="1">
            <div class="plan-name">企业版</div>
            <div class="plan-price">¥1 <span>/ 月</span></div>
            <div class="plan-desc">适合大型企业，包含全部功能</div>
        </div>

        <button class="pay-btn" id="payBtn">立即支付</button>
        <div id="message"></div>
    </div>

    <script>
        // 配置 - API 后端地址
        const CONFIG = {
            apiBase: 'https://api.asp.cool'
        };

        // 选择套餐
        document.querySelectorAll('.plan').forEach(plan => {
            plan.addEventListener('click', function() {
                document.querySelectorAll('.plan').forEach(p => p.classList.remove('selected'));
                this.classList.add('selected');
            });
        });

        // 生成订单号
        function generateOrderId() {
            return 'ORDER_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        // 支付按钮
        document.getElementById('payBtn').addEventListener('click', async function() {
            const selected = document.querySelector('.plan.selected');
            const plan = selected.dataset.plan;
            const amount = selected.dataset.amount;

            const btn = this;
            const msgDiv = document.getElementById('message');

            btn.disabled = true;
            btn.textContent = '正在创建订单...';
            msgDiv.innerHTML = '';

            try {
                const response = await fetch(`${CONFIG.apiBase}/api/alipay/pay`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        orderId: generateOrderId(),
                        plan: plan,
                        billing: 'monthly',
                        amount: parseFloat(amount)
                    })
                });

                const data = await response.json();

                if (data.formHtml) {
                    msgDiv.innerHTML = '<div class="success">订单创建成功，正在跳转到支付宝...</div>';
                    const container = document.createElement('div');
                    container.style.display = 'none';
                    container.innerHTML = data.formHtml;
                    document.body.appendChild(container);
                    const form = container.querySelector('form');
                    if (!form) {
                        throw new Error('支付宝支付表单生成失败');
                    }
                    form.submit();
                } else {
                    throw new Error(data.error || '创建订单失败');
                }
            } catch (error) {
                msgDiv.innerHTML = '<div class="error">支付发起失败: ' + error.message + '</div>';
                btn.disabled = false;
                btn.textContent = '立即支付';
            }
        });
    </script>
</body>
</html>
